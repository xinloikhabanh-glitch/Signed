name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén và kiểm tra mã nguồn
        shell: bash
        run: |
          if [ -f ios-src.zip ]; then
            unzip -oq ios-src.zip
          fi
          ls -la
          for f in project.yml Sources/App.swift Sources/WebHost.swift Resources/keys.html Resources/signer.html; do
            if [ ! -f "$f" ]; then
              echo "THIẾU FILE: $f  (hãy upload ios-src.zip ở thư mục gốc repo, đừng giải nén)"
              exit 1
            fi
          done
          if ls Sources/*.swift | grep -vE "App.swift|WebHost.swift"; then
            echo "Có file .swift lạ trong Sources/ (ở trên), hãy xoá nó."
            exit 1
          fi

      - name: Tạo icon
        shell: bash
        run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          echo '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          ICON=""
          if [ -f AppIcon.png ]; then
            sips -z 1024 1024 -s format jpeg AppIcon.png --out /tmp/icon.jpg
            sips -s format png /tmp/icon.jpg --out Assets.xcassets/AppIcon.appiconset/AppIcon.png
            ICON='"filename":"AppIcon.png",'
          fi
          echo "{\"images\":[{${ICON}\"idiom\":\"universal\",\"platform\":\"ios\",\"size\":\"1024x1024\"}],\"info\":{\"author\":\"xcode\",\"version\":1}}" > Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo project Xcode
        run: xcodegen generate

      - name: Build (không ký)
        shell: bash
        run: |
          set -o pipefail
          PROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME=$(xcodebuild -project "$PROJ" -list -json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['project']['schemes'][0])")
          echo "Project: $PROJ  Scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log

      - name: Hiện lỗi biên dịch
        if: failure()
        shell: bash
        run: |
          echo "=========== CÁC DÒNG LỖI ==========="
          grep -E "error:" build.log | sort -u | head -40 || true
          echo "===================================="

      - name: Đóng gói IPA
        shell: bash
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "Không thấy file .app"; exit 1; fi
          # kiểm tra 2 trang HTML đã vào app
          ls "$APP" | grep -E "keys.html|signer.html"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr TouchStudio.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TouchStudio-ipa
          path: TouchStudio.ipa
